# No hardware at all: synthetic frames/depth/IMU, CPU inference, dummy
# actuator. This is what the dev-local container runs
# (Dockerfile.dev-local, .devcontainer/dev-local).
#
#   python start.py --config config_dev_local.yaml

fps: 10                       # Hz
resolution: [640, 400]

# sensors
synthetic: true               # instead of the OAK-D
use_oakd_imu: false
i2c_address: null             # dummy actuator/IMU
i2c_bus: null

# vision: drivable-track segmentation (docs/vision.md)
vision:
  enabled: true                 # exercised here; the car configs leave it off
  model: ground_plane           # ground_plane | onnx
  onnx_model: track_seg.onnx    # model: onnx — network from scripts/train_vision.py (+ .json sidecar)

control_mode: "depth_ftg"     # map-free, works off the synthetic depth

# slam
enable_slam: false              # or --enable-slam
slam:
  vocabulary: ORB_SLAM3/Vocabulary/ORBvoc.txt
  settings: synthetic_slam_settings.yaml   # synthetic camera intrinsics (also used by ground_plane)

mapping:
  boundary_min_points: 10       # wall points needed before extracting (50 on the car)

recording: false
recording_path: /tmp/pilot_recordings

# smaller buffers than the on-car config
buffers:
  frame:
    slots: 4
  imu:
    slots: 8
  segmentation:
    slots: 4
  pose:
    slots: 4
  control:
    slots: 4
  pointcloud:
    slots: 2
  boundary:
    slots: 2

