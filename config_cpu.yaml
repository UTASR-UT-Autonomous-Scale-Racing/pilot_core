# config_cpu.yaml — Workstation profile: real OAK-D camera, CPU-only
# inference, no actuator output.
#
#   python start.py --config config_cpu.yaml                # vision + control
#   python start.py --config config_cpu.yaml --enable-slam  # + ORB-SLAM3 mapping
#   scripts/dev_run.sh                                      # same, with --debug
#
# I2C is deliberately disabled: on a laptop/desktop /dev/i2c-* are
# motherboard buses, not the car's Arduino.  Never point this profile at one.

# --- Pipeline ---
fps: 15                       # camera frame rate (Hz); leaves CPU headroom (OAK-D streams up to 30)
resolution: [640, 400]        # [width, height] of camera frames (px)
threads_per_worker: 1         # BLAS/OpenMP/OpenCV threads per worker process

# --- Sensor / Hardware ---
synthetic: false              # true: synthetic frames/depth/IMU instead of the OAK-D
use_oakd_imu: true            # stream the OAK-D IMU via the camera worker
i2c_address: null             # null → actuator runs in dummy mode (no writes)
i2c_bus: null

# --- Vision ---
segmentation_config_path: pilot_vision/models/default/config.yaml
use_tensorrt: false

# --- Control ---
# depth_ftg / vae / bc run map-free; pure_pursuit | stanley | lqr | mpc | policy
# need --enable-slam and a mapped track.
control_mode: "depth_ftg"

# --- PID Control (control_mode: pid) ---
pid:
  kp_steer: 1.0               # proportional steering gain
  ki_steer: 0.0               # integral steering gain
  kd_steer: 0.1               # derivative steering gain
  target_throttle: 0.3        # base throttle, signed [-1, 1]
  noise_std: 0.0              # std of Gaussian noise added to steering

# --- PWM (servo / ESC pulse widths, µs) ---
# Below neutral = left / backward, above neutral = right / forward.
pwm:
  steer_min: 1105             # full left
  steer_max: 1825             # full right
  steer_neutral: 1461         # straight
  throttle_min: 1199          # full backward
  throttle_max: 1595          # full forward
  throttle_neutral: 1397      # neutral (coast)


# --- Track following (control_mode: pure_pursuit | stanley | lqr | mpc | policy) ---
vehicle_params: vehicle_params.yaml   # physical vehicle parameters (relative to repo root)
track_control:
  spacing: 0.05                 # m, centre-line sample spacing
  pure_pursuit:
    lookahead_min: 0.6          # m
    lookahead_max: 2.0          # m
    k_v: 0.5                    # s, look-ahead growth with speed
  stanley:
    k: 1.0                      # cross-track error gain
    k_soft: 1.0                 # m/s, softening speed (avoids division by ~0 at low speed)
  lqr:
    q_lateral: 4.0              # weight on lateral error²
    q_heading: 1.0              # weight on heading error²
    r_steer: 2.0                # weight on steering (beyond curvature feed-forward)²
  mpc:
    horizon: 20                 # steps
    dt: 0.05                    # s per step (1 s horizon)
    q_lateral: 10.0             # weight on lateral error²
    q_heading: 2.0              # weight on heading error²
    r_steer: 1.0                # weight on steering²
    r_rate: 20.0                # weight on steering rate² (smoothness)
    delay: 0.05                 # s, actuation delay compensated
  policy:
    model: policy.onnx          # from rl/export_onnx.py (+ policy.json sidecar)
  fallback: null                # "depth_ftg": drive map-free while the state estimate is stale
  fallback_after: 0.3           # s without a fresh state before the fallback engages
  speed:
    v_max: 1.3                  # m/s — keep below safety.speed_cap
    lat_accel_fraction: 0.6     # fraction of friction_coeff * g allowed in corners
    accel: 1.5                  # m/s²
    decel: 1.0                  # m/s² (coasting + limited backward input)
    longitudinal:
      speed_per_throttle: 3.0   # m/s per unit throttle — CALIBRATE on the car
      kp: 0.25                  # speed PI proportional gain
      ki: 0.15                  # speed PI integral gain
      max_backward: 0.3         # most backward input used to slow down
      min_speed_for_backward: 0.3   # m/s, below this no backward input is used


# --- Map-free depth Follow-the-Gap (control_mode: depth_ftg, or track fallback) ---
depth_ftg:
  camera_height: 0.12           # m above ground — MEASURE on the car
  min_obstacle_height: 0.04     # m, below = floor
  max_obstacle_height: 0.50     # m, above = ignored
  max_range: 4.0                # m
  bubble_radius: 0.25           # m around the nearest obstacle
  aim_distance: 0.7             # m
  cruise_speed: 0.6             # m/s
  stop_distance: 0.35           # m — obstacle this close ahead → neutral


# --- VAE control model (control_mode: vae, map-free) ---
vae:
  model: vae_policy.onnx        # from scripts/train_vae_policy.py (+ .json sidecar)
  cruise_speed: 0.8             # m/s
  steer_slowdown: 0.5           # speed *= 1 - steer_slowdown * |steering|


# --- Behaviour-cloning control model (control_mode: bc, map-free) ---
bc:
  model: bc_policy.onnx         # from scripts/train_bc_policy.py (+ .json sidecar)
  cruise_speed: 0.8             # m/s
  steer_slowdown: 0.5           # speed *= 1 - steer_slowdown * |steering|


# --- State estimator (pose EKF) ---
estimator:
  pos_std: 0.03                 # m, pose position measurement noise
  yaw_std: 0.03                 # rad, pose heading measurement noise
  stale_after: 0.5              # s without a pose → stop driving


# --- Safety supervisor (ActuatorWorker) ---
safety:
  command_timeout: 0.150        # s — no fresh command → throttle neutral
  speed_cap: 1.5                # m/s — forward throttle tapers to 0 approaching this
  cap_margin: 0.2               # m/s taper band below the cap
  # Forward throttle is also bounded by speed_cap / speed_per_throttle
  # (track_control.speed.longitudinal.speed_per_throttle) — calibrate it.
  max_throttle_no_speed: 0.4    # forward cap when there is no speed estimate
  steering_rate: 7.6            # units/s (signed range [-1, 1])
  throttle_rate: 4.0            # units/s


# --- SLAM ---
enable_slam: false              # run ORB-SLAM3 + mapping (also: start.py --enable-slam)
slam:
  vocabulary: ORB_SLAM3/Vocabulary/ORBvoc.txt
  settings: orbslam_oakd_rgbd.yaml    # regenerate: scripts/gen_orbslam_settings.py

# --- Mapping (BEV boundary extraction) ---
mapping:
  boundary_min_points: 50       # wall points required before boundaries are extracted

# --- Recording ---
recording: false                # record buffers to disk (also: start.py --recording)
recording_path: /tmp/pilot_recordings

# --- Web Telemetry (optional HTTP publisher) ---
web_publish:
  enabled: false

# --- Shared Buffers (ring-buffer slots per stream) ---
buffers:
  frame:
    slots: 8
  imu:
    slots: 32
  segmentation:
    slots: 4
  pose:
    slots: 8
  control:
    slots: 8
  pointcloud:
    slots: 4
  boundary:
    slots: 2

# --- Deployment ---
device: "cpu"                   # torch device for inference
