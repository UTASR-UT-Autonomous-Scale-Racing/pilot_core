# AutoDRIVE simulator: sensors, ground-truth pose and control over ZMQ via autodrive_bridge.
#   python start.py --config config_zmq.yaml

# zmq bridge
use_zmq: true                   # ZMQ bridge instead of camera/IMU/I2C
zmq_host: "localhost"           # "autodrive_bridge" if it's in its own container
zmq_sensor_port: 5555           # SUB, sensors from the sim
zmq_control_port: 5556          # PUB, commands to the sim
zmq_telemetry_port: 5557        # PUB, telemetry/vis (zmq_publish below)
use_zmq_pose: true              # sim ground-truth pose; the point cloud then comes from lidar projection

# hardware, all unused in the sim
i2c_address: null
i2c_bus: null
use_oakd_imu: false
synthetic: false

resolution: [640, 360]          # sim camera, [width, height]
fps: 30

depth_max_meters: 15.0          # m, must match farClipPlane in the sim's DepthCamera.cs
depth_raw_scale: null           # m per unit for raw uint16 depth; unused with 8-bit depth

# off: no trained sim model, and ground_plane needs intrinsics the sim lacks
vision:
  enabled: false

control_mode: "pure_pursuit"    # pure_pursuit | stanley | lqr | mpc | policy | depth_ftg | vae | bc

# LidarProjectionWorker (enable_slam + use_zmq_pose); sim Hokuyo UST-10LX, 1080 rays, 0.06-10 m
lidar:
  range_min: 0.1                # m, closer than this is the car's own body
  range_max: 9.5                # m, drops the max-range / no-return values
  voxel_size: 0.10              # m, dedup cell
  move_threshold: 0.05          # m moved before we project another scan

# SLAM
enable_slam: true               # NB with use_zmq_pose this means lidar projection, not ORB-SLAM3
use_saved_map: false            # skip mapping, load boundaries from saved_map_path
saved_map_path: "rl/boundaries_easy"   # dir with outer_line.npy / inner_line.npy
# ORB-SLAM3 in the sim (use_zmq_pose: false) needs a sim-camera settings file (none shipped);
# without it depth_ftg / ground_plane fall back to the OAK-D intrinsics.
slam:
  vocabulary: "ORB_SLAM3/Vocabulary/ORBvoc.txt"
  # settings: "sim_orbslam_settings.yaml"

# mapping
mapping:
  boundary_min_points: 50
  bev_axes: [0, 1]              # sim world is Z-up so X, Y are horizontal. ORB-SLAM3 camera frame would be [0, 2]
  forward_axis: 0               # X forward in the sim vehicle frame (2 for ORB-SLAM3 camera frame)
  boundary_save_path: "rl/boundaries_easy"   # null = don't save

# buffer slots
buffers:
  frame:
    slots: 8
  imu:
    slots: 32
  segmentation:
    slots: 4
  pose:
    slots: 8
  control:
    slots: 8
  pointcloud:
    slots: 4
  boundary:
    slots: 2
  lidar:
    slots: 16

# telemetry back to the sim, on zmq_telemetry_port
zmq_publish:
  enabled: true                 # commands already reach the sim via the actuator on 5556
  pose: true                    # trajectory
  segmentation: false           # vision is disabled in the sim (see vision above)
  boundary: true                # only if mapping is running
  pointcloud: true              # same

# recording
recording: false                # also start.py --recording
recording_path: "/tmp/pilot_recordings"
recording_config:
  sample_k: 1                   # every k-th sample
  top_n: 1000                   # records per file (then rotate), 0 = unlimited

