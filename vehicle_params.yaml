# vehicle_params.yaml — Physical vehicle parameters for controllers and the
# evaluation simulator.
#
# PLACEHOLDER VALUES: copied from the F1TENTH simulator
# (https://github.com/f1tenth/f1tenth_simulator/blob/master/params.yaml)
# until the UTASR car is measured.  Replace each value as it is measured and
# note it in the comment.

# --- Geometry ---
wheelbase: 0.3302             # m, front-to-rear axle
width: 0.2032                 # m
l_cg2rear: 0.17145            # m, centre of gravity to rear axle
l_cg2front: 0.15875           # m, centre of gravity to front axle
height_cg: 0.074              # m

# --- Limits ---
max_speed: 7.0                # m/s
max_steering_angle: 0.4189    # rad (~24°), full lock either side
max_steering_vel: 3.2         # rad/s
max_accel: 7.51               # m/s²
max_decel: 8.26               # m/s²

# --- Dynamics (single-track model) ---
mass: 3.47                    # kg
moment_inertia: 0.04712       # kg·m²
friction_coeff: 0.523         # -
C_S_front: 4.718              # 1/rad, cornering stiffness
C_S_rear: 5.4562              # 1/rad

# --- Actuation ---
steering_delay_steps: 5       # F1TENTH "buffer_length": steering command delay
