# Jetson image (JetPack 6, aarch64) built natively on an arm64 runner: on car-v* tags it is pushed
# to ghcr.io; run by hand from the Actions tab to only build it. ORB_SLAM3 is checked out without
# the private firmware submodule, which the image does not need.
name: Jetson image

on:
  push:
    tags: ["car-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Dockerfile target (runtime = with ORB-SLAM3, noslam = without)"
        default: runtime
        type: choice
        options: [runtime, noslam]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: ORB_SLAM3 submodule
        run: git submodule update --init --depth 1 ORB_SLAM3

      - name: Disk space for the JetPack base image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo docker system prune -af || true
          df -h /

      - name: Build
        run: |
          docker build --target "${{ inputs.target || 'runtime' }}" -t pilot_core-jetson -f Dockerfile .
          docker run --rm --shm-size=1g --entrypoint python3 pilot_core-jetson scripts/jetson_selftest.py --only shm,buffers

      - name: Push
        if: startsWith(github.ref, 'refs/tags/car-v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          docker tag pilot_core-jetson "$image:${GITHUB_REF_NAME}"
          docker push "$image:${GITHUB_REF_NAME}"
