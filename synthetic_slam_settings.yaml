%YAML:1.0

#--------------------------------------------------------------------------------------------
# ORB-SLAM3 RGB-D settings for the synthetic cameras (config_dev_local.yaml and
# tests/test_slam_synthetic_pipeline.py). Intrinsics must match synthetic.SYNTH_FX
# and the 640x400 frames of synthetic/closed_loop_generator.py.
# With File.version "1.0" ORB-SLAM3 only reads the Camera1.* intrinsics
# (ORB_SLAM3/src/Settings.cc); the legacy Camera.fx / Camera.k1 / ThDepth keys
# are ignored, so they are not listed.
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

Camera1.fx: 456.99
Camera1.fy: 456.99
Camera1.cx: 320.0
Camera1.cy: 200.0

# No distortion (synthetic pinhole)
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

Camera.width: 640
Camera.height: 400
Camera.fps: 25

# Colour order (0: BGR, 1: RGB). The synthetic frames, like CameraWorker's, are RGB.
Camera.RGB: 1

# Depth is float32 in metres, factor 1.0 means no conversion
RGBD.DepthMapFactor: 1.0

# Virtual stereo baseline (m); in RGB-D mode it only scales the close/far threshold
Stereo.b: 0.075
Stereo.ThDepth: 40.0

#--------------------------------------------------------------------------------------------
# ORB Parameters — low FAST thresholds so features are found on synthetic textures
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1500
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 15
ORBextractor.minThFAST: 5

#--------------------------------------------------------------------------------------------
# Viewer Parameters (viewer disabled, but required by the parser)
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
