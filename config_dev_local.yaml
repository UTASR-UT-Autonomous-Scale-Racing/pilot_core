# config_dev_local.yaml — No-hardware profile: synthetic frames/depth/IMU,
# CPU inference, no actuator output.  Used by the dev-local container
# (Dockerfile.dev-local / .devcontainer/dev-local).
#
#   python start.py --config config_dev_local.yaml

# --- Pipeline ---
fps: 10                       # synthetic frame rate (Hz)
resolution: [640, 400]        # [width, height] of frames (px)

# --- Sensor / Hardware ---
synthetic: true               # synthetic frames/depth/IMU instead of the OAK-D
use_oakd_imu: false
i2c_address: null             # null → actuator/IMU run in dummy mode (no writes)
i2c_bus: null

# --- Vision ---
segmentation_config_path: pilot_vision/models/default/config.yaml
use_tensorrt: false

# --- Control ---
control_mode: "depth_ftg"     # map-free on synthetic depth

# --- PID Control (control_mode: pid) ---
pid:
  kp_steer: 1.0               # proportional steering gain
  ki_steer: 0.0               # integral steering gain
  kd_steer: 0.1               # derivative steering gain
  target_throttle: 0.3        # base throttle, signed [-1, 1]
  noise_std: 0.0              # std of Gaussian noise added to steering

# --- SLAM ---
enable_slam: false              # run ORB-SLAM3 + mapping (also: start.py --enable-slam)
slam:
  vocabulary: ORB_SLAM3/Vocabulary/ORBvoc.txt
  settings: synthetic_slam_settings.yaml   # intrinsics of the synthetic camera

# --- Mapping (BEV boundary extraction) ---
mapping:
  boundary_min_points: 10       # wall points required before boundaries are extracted

# --- Recording ---
recording: false                # record buffers to disk (also: start.py --recording)
recording_path: /tmp/pilot_recordings

# --- Web Telemetry (optional HTTP publisher) ---
web_publish:
  enabled: false

# --- Shared Buffers (ring-buffer slots per stream) ---
buffers:
  frame:
    slots: 4
  imu:
    slots: 8
  segmentation:
    slots: 4
  pose:
    slots: 4
  control:
    slots: 4
  pointcloud:
    slots: 2
  boundary:
    slots: 2

# --- Deployment ---
device: "cpu"                   # torch device for inference
