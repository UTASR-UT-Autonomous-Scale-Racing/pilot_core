# CI: pyflakes + hardware-free tests (oakd / slam tests deselected), on pull requests only
# (not again when a PR is merged); run it by hand from the Actions tab if needed.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      # no submodules: ORB_SLAM3 (~930 MB) and firmware aren't needed for tests
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      # libgl1/libglib2.0-0 for any transitive non-headless OpenCV
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libusb-1.0-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,train]"

      - name: pyflakes
        run: |
          python -m pyflakes control vision workers shared_buffer rl scripts tests start.py

      - name: pytest
        run: python -m pytest -m "not oakd and not slam" -ra
