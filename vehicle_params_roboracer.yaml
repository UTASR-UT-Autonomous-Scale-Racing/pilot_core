# AutoDRIVE RoboRacer (the simulated F1TENTH-class car in the AutoDRIVE Unity sim),
# loaded by control.types.VehicleParams via config_autodrive.yaml.
# Geometry from the AutoDRIVE devkit (autodrive_bridge.py TFs: front axle 0.33 m ahead
# of the rear-axle vehicle frame, wheels at +-0.118 m) and the RoboRacer docs
# (max steering 30 deg); width is the body width. Checked in the sim in step 2 of
# docs/autodrive.md (steering -> curvature).

wheelbase: 0.324              # m
width: 0.27                   # m
max_steering_angle: 0.5236    # rad, 30 deg each way (sim maps steering +-1 to +-30 deg)
max_steering_vel: 3.2         # rad/s
max_speed: 22.88              # m/s, sim top speed (not reached under the safety cap)
max_accel: 7.51               # m/s^2
max_decel: 8.26               # m/s^2
friction_coeff: 0.523         # -
