# Configuration file for Pilot Core


# --- Pipeline ---
fps: 30
resolution: [640, 400]
stereo_resolution: [1280, 800]
depth_preset: FAST_ACCURACY
sync_threshold_ms: 25.0
xlink_chunk_size: 0
rgb_undistort: true
ir_dot_intensity: 0.8
ir_flood_intensity: 0.8
adaptive_ir: true
ir_update_interval_s: 0.5

# --- Sensor / Hardware ---
use_oakd_imu: true
i2c_address: 0x08
i2c_bus: 1
actuator_dummy: true         # Local testing: skip actuator I2C writes

# --- Vision ---
segmentation_config_path: pilot_vision/models/default/config.yaml
use_tensorrt: false           # Set true on Jetson to load TensorRT engines

# --- Control ---
control_config_path: pilot_controller/models/default/config.yaml
control_mode: "neural"        # "neural" or "pid"

# --- PID Control (used when control_mode = "pid") ---
pid:
  kp_steer: 1.0
  ki_steer: 0.0
  kd_steer: 0.1
  target_throttle: 0.3
  noise_std: 0.05

# --- SLAM ---
enable_slam: true
slam:
  vocabulary: ORB_SLAM3/Vocabulary/ORBvoc.txt
  settings: oak_d_orbslam_settings.yaml
  sensor: RGBD

# --- Mapping (BEV boundary extraction) ---
mapping:
  enabled: true              # Set false to skip map-building lap
  pointcloud_only: false     # If true, disable map/boundary generation and only keep SLAM pointcloud flow
  load_path: null             # Optional .npz/.json map file to preload
  save_path: null             # Optional .npz path to save mapped boundaries
  set_localize_on_load: true  # Enter SLAM localization mode after load
  extract_on_loop_only: false # If false, allow timeout-based extraction without loop closure
  auto_extract_timeout_s: 20.0
  alpha_shape: 25.0
  boundary_min_points: 50
  origin_keyframe: 0

# --- Runtime Map Plot (optional) ---
map_plot:
  enabled: false              # Launch MapPlotWorker for live map visualization
  record_video: false         # Save map_plot video from MapPlotWorker
  fps: 10
  save_dir: /tmp/pilot_map
  video_filename: map_recording.mp4
  max_trail_laps: 5

# --- RGBD Remote Visualization (optional) ---
rgbd_visualization:
  enabled: false
  web_socket_port: 8765
  http_port: 8082
  depth_source: stereo        # live pipeline currently supports stereo only

# --- Recording ---
recording: true
recording_path: ~/recordings/recording_{datetime}

# --- Web Telemetry Publisher (optional) ---
web_publish:
  enabled: false
  endpoint: "http://localhost:8080/api/telemetry"
  interval: 1.0               # Seconds between POSTs
  timeout: 2.0                # HTTP timeout per request
  vehicle_id: "pilot_1"
  max_trajectory_pts: 500     # Cap trajectory points per payload

# --- Replay Video ---
replay_video:
  include_map_plot: true      # Show map panel in recordings_to_mp4 output

recording_config:
  sample_k: 1                 # Global: save every k-th sample (1 = all)
  top_n: 0                    # Global: max records per buffer (0 = unlimited)
  # Per-buffer overrides (inherit global if omitted):
  frame:
    sample_k: 2               # Frames are large — save every 2nd
    top_n: 5000
  imu:
    sample_k: 1               # IMU is tiny — save everything
    top_n: 0
  segmentation:
    sample_k: 2
    top_n: 5000
  pose:
    sample_k: 1
    top_n: 0
  control:
    sample_k: 1
    top_n: 0
  pointcloud:
    sample_k: 5               # Point clouds are heavy
    top_n: 2000
  boundary:
    sample_k: 10
    top_n: 500

# --- Shared Buffers ---
buffers:
  frame:
    slots: 8
  imu:
    slots: 32
  segmentation:
    slots: 4
  pose:
    slots: 8
  control:
    slots: 8
  pointcloud:
    slots: 4
  boundary:
    slots: 2

# --- Deployment ---
device: "cuda:0"              # Primary CUDA device
tensorrt_workspace_mb: 1024   # TensorRT builder workspace
