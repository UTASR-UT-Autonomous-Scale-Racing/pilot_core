# No hardware: synthetic camera drives a scripted lap, dummy actuator; press l after a lap to map.
#   python start.py --config config_dev_local.yaml                  # map-free depth_ftg
#   python start.py --config config_dev_local.yaml --enable-slam --control-mode pure_pursuit

fps: 10                       # Hz
resolution: [640, 400]

# sensors
synthetic: true               # instead of the OAK-D
synthetic_scene: track        # track: ray-cast closed track | corridor: flat-shaded stand-in
synthetic_track:              # synthetic.closed_loop_generator.ClosedLoopFrameGenerator
  n_frames: 200               # frames per lap
  straight_len: 4.0           # m
  turn_radius: 2.0            # m
  wall_distance: 0.8          # m, driven line to each wall
  camera_height: 0.15         # m
  camera_pitch_deg: 12.0
use_oakd_imu: false
i2c_address: null             # dummy actuator/IMU
i2c_bus: null

# vision: drivable-track segmentation
vision:
  enabled: true                 # exercised here; the car configs leave it off
  model: ground_plane           # ground_plane | onnx
  onnx_model: track_seg.onnx    # model: onnx — network from scripts/train_vision.py (+ .json sidecar)

control_mode: "depth_ftg"     # map-free, works off the synthetic depth

depth_ftg:                    # the synthetic camera's mounting
  camera_height: 0.15           # m (mapping uses it too)
  camera_pitch: 0.2094          # rad, 12 deg down

# slam
enable_slam: false              # or --enable-slam
slam:
  vocabulary: ORB_SLAM3/Vocabulary/ORBvoc.txt
  settings: synthetic_slam_settings.yaml   # synthetic camera intrinsics (also used by ground_plane)

mapping:
  boundary_min_points: 10       # wall points needed before extracting (50 on the car)
  max_track_half_width: 1.5     # m, wall points further from the driven line are dropped

recording: false
recording_path: /tmp/pilot_recordings

# smaller buffers than the on-car config
buffers:
  frame:
    slots: 4
  imu:
    slots: 32
  segmentation:
    slots: 4
  pose:
    slots: 4
  control:
    slots: 4
  pointcloud:
    slots: 2
  boundary:
    slots: 2

