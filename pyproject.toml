# pilot_core packaging; requirements.txt mirrors the runtime dependencies.
#   pip install -e ".[test,train,rl,slam,plot]"   # pick the extras you need

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pilot_core"
version = "0.1.0"
description = "On-vehicle software for UTASR's autonomous scale race car: camera, IMU, SLAM, mapping, control and actuation"
readme = "README.md"
# Developed and tested on 3.10 (Ubuntu 22.04 / JetPack 6).
requires-python = ">=3.10"
authors = [{ name = "UTASR - UT Autonomous Scale Racing" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy",
    "scipy",
    "PyYAML",
    "opencv-python-headless",
    "depthai>=3.0",      # OAK-D camera + IMU (v3 API)
    "smbus2",            # Arduino I2C link (Jetson)
    "pyzmq",             # AutoDRIVE simulator bridge
    "osqp",              # QP solver for control_mode: mpc
    "onnxruntime",       # control_mode: policy / vae / bc, vision.model: onnx (CPU inference)
]

[project.optional-dependencies]
test = ["pytest", "pytest-timeout", "pyflakes", "websockets>=13"]   # websockets: fake-sim tests
# AutoDRIVE sim link (workers/autodrive_worker.py). Not python-socketio: the sim's client
# never completes a python-socketio 4/5 handshake (docs/autodrive.md)
sim = ["websockets>=13"]
train = ["torch", "torchvision", "onnx"]
rl = ["stable-baselines3[extra]", "gymnasium", "torch", "onnx"]
slam = ["pybind11"]
plot = ["matplotlib"]  # scripts/sim_bench.py --plot

[project.urls]
Homepage = "https://github.com/UTASR-UT-Autonomous-Scale-Racing/pilot_core"

[tool.setuptools]
# explicit list so submodules (ORB_SLAM3, firmware) aren't discovered
packages = ["control", "vision", "workers", "shared_buffer", "synthetic", "rl"]
py-modules = ["start"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
    "slow: long-running test (closed-loop sims, training)",
    "oakd: needs a connected OAK-D camera",
    "slam: needs the ORB-SLAM3 build (orbslam3_python + ORB_SLAM3/lib)",
    "train: needs torch",
]
