# config_dev_local.yaml — Configuration for dev-local (no hardware) testing
# Uses synthetic frame/depth/IMU data.

# --- Pipeline ---
fps: 10
resolution: [640, 400]

# --- Sensor / Hardware ---
use_oakd_imu: false
i2c_address: null
i2c_bus: null

# --- Synthetic ---
synthetic: true

# --- Vision ---
segmentation_config_path: pilot_vision/models/default/config.yaml
use_tensorrt: false

# --- Control ---
control_mode: "depth_ftg"     # map-free on synthetic depth

# --- PID Control ---
pid:
  kp_steer: 1.0
  ki_steer: 0.0
  kd_steer: 0.1
  target_throttle: 0.3
  noise_std: 0.0

# --- SLAM ---
enable_slam: false
slam:
  vocabulary: ORB_SLAM3/Vocabulary/ORBvoc.txt
  settings: synthetic_slam_settings.yaml
  sensor: RGBD

# --- Mapping ---
mapping:
  alpha_shape: 25.0
  boundary_min_points: 10
  origin_keyframe: 0

# --- Recording ---
recording: false
recording_path: /tmp/pilot_recordings

# --- Web Telemetry (disabled in dev) ---
web_publish:
  enabled: false

# --- Shared Buffers ---
buffers:
  frame:
    slots: 4
  imu:
    slots: 8
  segmentation:
    slots: 4
  pose:
    slots: 4
  control:
    slots: 4
  pointcloud:
    slots: 2
  boundary:
    slots: 2

# --- Deployment ---
device: "cpu"
tensorrt_workspace_mb: 0
