# AutoDRIVE simulator. Sensors, ground-truth pose and control all go over ZMQ
# through autodrive_bridge, no hardware involved.
#
#   python start.py --config config_zmq.yaml

# zmq bridge
use_zmq: true                   # ZMQ bridge instead of camera/IMU/I2C
zmq_host: "localhost"           # "autodrive_bridge" if it's in its own container
zmq_sensor_port: 5555           # SUB, sensors from the sim
zmq_control_port: 5556          # PUB, commands to the sim
zmq_telemetry_port: 5557        # PUB, telemetry/vis (zmq_publish below)
use_zmq_pose: true              # sim ground-truth pose; the point cloud then comes from lidar projection

# hardware, all unused in the sim
i2c_address: null
i2c_bus: null
use_oakd_imu: false
synthetic: false

resolution: [640, 360]          # sim camera, [width, height]
fps: 30

# Depth far clip in metres. Has to match farClipPlane in the sim's
# DepthCamera.cs (15.0): the sim sends 8-bit linear depth and
# ZMQSensorWorker turns it into metres as pixel / 255 * depth_max_meters
depth_max_meters: 15.0

segmentation_config_path: "pilot_vision/models/deeplab/config.yaml"
vision:
  model: pilot_vision           # pilot_vision | onnx | ground_plane (docs/vision.md)
  onnx_model: track_seg.onnx    # model: onnx — network from scripts/train_vision.py (+ .json sidecar)

control_mode: "pid"             # pure_pursuit | stanley | lqr | mpc | policy | pid | ftg | lidar_pid | depth_ftg | vae | bc

# lidar, for LidarProjectionWorker (enable_slam + use_zmq_pose).
# The sim models a Hokuyo UST-10LX: 1080 rays over ±135°, 0.06-10 m, mounted
# at [x=0.2733, y=0.0, z=0.096] m in the vehicle frame
lidar:
  range_min: 0.1                # m, closer than this is the car's own body
  range_max: 9.5                # m, drops the max-range / no-return values
  voxel_size: 0.10              # m, dedup cell
  move_threshold: 0.05          # m moved before we project another scan

# SLAM
enable_slam: true               # NB with use_zmq_pose this means lidar projection, not ORB-SLAM3
use_saved_map: false            # skip mapping, load boundaries from saved_map_path
saved_map_path: "rl/boundaries_easy"   # dir with outer_line.npy / inner_line.npy
slam:
  vocabulary: "ORB_SLAM3/Vocabulary/ORBvoc.txt"
  settings: "simulator_orbslam_settings.yaml"

# mapping
mapping:
  boundary_min_points: 50
  bev_axes: [0, 1]              # sim world is Z-up so X, Y are horizontal. ORB-SLAM3 camera frame would be [0, 2]
  forward_axis: 0               # X forward in the sim vehicle frame (2 for ORB-SLAM3 camera frame)
  boundary_save_path: "rl/boundaries_easy"   # null = don't save

# pid and lidar_pid
pid:
  kp_steer: 2.0
  ki_steer: 0.0
  kd_steer: 0.1
  target_throttle: 0.05         # signed [-1, 1]
  sector_deg: 60.0              # lidar_pid only: half-angle of the forward sector it looks for walls in
  slow_corner_factor: 0.6       # lidar_pid only: throttle multiplier at full steer

# ftg: follow-the-gap on a virtual scan cast against the mapped boundaries
ftg:
  num_beams: 360
  fov_deg: 270.0                # total, centred on heading
  max_range: 5.0                # m
  bubble_radius_deg: 30.0       # half-width of the bubble around the nearest obstacle
  smooth_window: 5              # moving average over the ranges
  target_throttle: 0.05
  throttle_corner_scale: 0.5    # throttle = base * (1 - scale * |steering|)
  noise_std: 0.05               # steering noise
  gap_strategy: "deepest"       # "deepest" or "centroid"

# buffer slots
buffers:
  frame:
    slots: 8
  imu:
    slots: 32
  segmentation:
    slots: 4
  pose:
    slots: 8
  control:
    slots: 8
  pointcloud:
    slots: 4
  boundary:
    slots: 2
  lidar:
    slots: 16

# telemetry back to the sim, on zmq_telemetry_port
zmq_publish:
  enabled: true
  control: true
  pose: true                    # trajectory
  segmentation: true
  boundary: true                # only if mapping is running
  pointcloud: true              # same

# recording
recording: false                # also start.py --recording
recording_path: "/tmp/pilot_recordings"
recording_config:
  sample_k: 1                   # every k-th sample
  top_n: 1000                   # per buffer, 0 = unlimited

web_publish:
  enabled: false
