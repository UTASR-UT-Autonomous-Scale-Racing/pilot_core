%YAML:1.0

#--------------------------------------------------------------------------------------------
# ORB-SLAM3 RGB-D settings for the synthetic camera (config_dev_local.yaml).
# Intrinsics must match synthetic/closed_loop_generator.py.
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Synthetic camera intrinsics (640x480)
Camera.fx: 456.99
Camera.fy: 456.99
Camera.cx: 320.0
Camera.cy: 240.0

# Same intrinsics under the Camera1.* keys, which the RGB-D loader reads
Camera1.fx: 456.99
Camera1.fy: 456.99
Camera1.cx: 320.0
Camera1.cy: 240.0

# No distortion (synthetic pinhole)
Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0
Camera.k3: 0.0

Camera.width: 640
Camera.height: 480
Camera.fps: 25

# Depth is float32 in metres — factor 1.0 means no conversion
RGBD.DepthMapFactor: 1.0

# Colour order (0: BGR, 1: RGB)
Camera.RGB: 0

# Close/far depth threshold, in multiples of the stereo baseline
ThDepth: 40.0
Stereo.ThDepth: 40.0

# Virtual stereo baseline (m); only scales the close/far threshold in RGB-D mode
Stereo.b: 0.075

#--------------------------------------------------------------------------------------------
# ORB Parameters — low FAST thresholds so features are found on synthetic textures
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1500
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 15
ORBextractor.minThFAST: 5

#--------------------------------------------------------------------------------------------
# Viewer Parameters (viewer disabled, but required by the parser)
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
