# Physical parameters for the controllers and the bench sim, loaded by
# control.types.VehicleParams.
#
# NB these are placeholders copied from the F1TENTH simulator
# (https://github.com/f1tenth/f1tenth_simulator/blob/master/params.yaml)
# because the UTASR car hasn't been measured yet. As values get measured,
# replace them and say so in the comment.
#
# [ref] = not read by anything yet (VehicleParams ignores unknown keys), kept
# around for a dynamic model later.

# geometry
wheelbase: 0.3302             # m, front-to-rear axle
width: 0.2032                 # m
l_cg2rear: 0.17145            # m, centre of gravity to rear axle [ref]
l_cg2front: 0.15875           # m, centre of gravity to front axle [ref]
height_cg: 0.074              # m [ref]

max_speed: 7.0                # m/s
max_steering_angle: 0.4189    # rad, ~24 deg each way
max_steering_vel: 3.2         # rad/s
max_accel: 7.51               # m/s^2
max_decel: 8.26               # m/s^2

# single-track dynamics
mass: 3.47                    # kg [ref]
moment_inertia: 0.04712       # kg·m² [ref]
friction_coeff: 0.523         # -
C_S_front: 4.718              # 1/rad, cornering stiffness [ref]
C_S_rear: 5.4562              # 1/rad [ref]

steering_delay_steps: 5       # F1TENTH's "buffer_length", steering delay [ref]
