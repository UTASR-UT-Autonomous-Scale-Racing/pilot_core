# On-car config (Jetson): OAK-D, CUDA inference, Arduino actuator over I2C,
# ORB-SLAM3 mapping.
#
#   python start.py                      # uses this file by default
#   scripts/run.sh / scripts/start.sh    # native / Docker launch on the Jetson

fps: 30                       # camera, Hz
resolution: [640, 400]        # [width, height] px

# hardware
use_oakd_imu: false           # true = OAK-D IMU through the camera worker, false = Arduino IMU over I2C
i2c_address: 0x08             # Arduino address. null -> actuator/IMU run as dummies
i2c_bus: 1                    # /dev/i2c-<bus>

# vision
segmentation_config_path: pilot_vision/models/default/config.yaml
vision:
  model: pilot_vision           # pilot_vision | onnx | ground_plane (docs/vision.md)
  onnx_model: track_seg.onnx    # model: onnx — network from scripts/train_vision.py (+ .json sidecar)

control_mode: "pure_pursuit"  # pure_pursuit | stanley | lqr | mpc | policy | depth_ftg | vae | bc | pid | ftg

# control_mode: pid
pid:
  kp_steer: 1.0
  ki_steer: 0.0
  kd_steer: 0.1
  target_throttle: 0.3        # base throttle, signed [-1, 1]
  noise_std: 0.05             # gaussian noise on steering (std)

# servo / ESC pulse widths in us. Below neutral is left / backward,
# above is right / forward
pwm:
  steer_min: 1105             # full left
  steer_max: 1825             # full right
  steer_neutral: 1461         # straight
  throttle_min: 1199          # full backward
  throttle_max: 1595          # full forward
  throttle_neutral: 1397      # coast

# track following: pure_pursuit, stanley, lqr, mpc, policy
vehicle_params: vehicle_params.yaml   # relative to repo root
track_control:
  spacing: 0.05                 # m, centre-line sample spacing
  pure_pursuit:
    lookahead_min: 0.6          # m
    lookahead_max: 2.0          # m
    k_v: 0.5                    # s, lookahead grows with speed
  stanley:
    k: 1.0                      # cross-track error gain
    k_soft: 1.0                 # m/s, keeps the division sane near zero speed
  lqr:
    q_lateral: 4.0              # lateral error^2
    q_heading: 1.0              # heading error^2
    r_steer: 2.0                # steering beyond the curvature feed-forward, squared
  mpc:
    horizon: 20                 # steps
    dt: 0.05                    # s, so a 1 s horizon
    q_lateral: 10.0             # weights are on squared terms
    q_heading: 2.0
    r_steer: 1.0
    r_rate: 20.0                # steering rate, for smoothness
    delay: 0.05                 # s of actuation delay to compensate
  policy:
    model: policy.onnx          # rl/export_onnx.py output, wants policy.json next to it
  fallback: null                # set to "depth_ftg" to keep driving map-free while the state is stale
  fallback_after: 0.3           # s of stale state before it kicks in
  speed:
    v_max: 1.3                  # m/s, keep under safety.speed_cap
    lat_accel_fraction: 0.6     # of friction_coeff * g, in corners
    accel: 1.5                  # m/s^2
    decel: 1.0                  # m/s^2, coasting plus a bit of reverse
    longitudinal:
      speed_per_throttle: 3.0   # m/s per unit throttle. TODO calibrate on the car
      kp: 0.25                  # speed PI
      ki: 0.15
      max_backward: 0.3         # max reverse input used for braking
      min_speed_for_backward: 0.3   # m/s, no reverse braking below this

# depth follow-the-gap, map-free (control_mode: depth_ftg, or as the track fallback)
depth_ftg:
  camera_height: 0.12           # m above ground, needs measuring on the car
  min_obstacle_height: 0.04     # m, anything lower is floor
  max_obstacle_height: 0.50     # m, anything higher is ignored
  max_range: 4.0                # m
  bubble_radius: 0.25           # m around the nearest obstacle
  aim_distance: 0.7             # m
  cruise_speed: 0.6             # m/s
  stop_distance: 0.35           # m, obstacle this close ahead -> neutral

# control_mode: vae (map-free)
vae:
  model: vae_policy.onnx        # scripts/train_vae_policy.py, needs the .json too
  cruise_speed: 0.8             # m/s
  steer_slowdown: 0.5           # speed *= 1 - steer_slowdown * |steering|

# behaviour cloning, control_mode: bc, also map-free
bc:
  model: bc_policy.onnx         # from scripts/train_bc_policy.py
  cruise_speed: 0.8             # m/s
  steer_slowdown: 0.5           # speed *= 1 - steer_slowdown * |steering|

# pose EKF
estimator:
  pos_std: 0.03                 # m, measurement noise
  yaw_std: 0.03                 # rad
  stale_after: 0.5              # s without a pose and we stop driving

# safety supervisor, runs in ActuatorWorker
safety:
  command_timeout: 0.150        # s, no fresh command -> neutral throttle
  speed_cap: 1.5                # m/s, forward throttle tapers to 0 as we approach it
  cap_margin: 0.2               # m/s, width of that taper
  # NB forward throttle is also capped at speed_cap / speed_per_throttle
  # (track_control.speed.longitudinal), so calibrate that one
  max_throttle_no_speed: 0.4    # forward cap with no speed estimate
  steering_rate: 7.6            # units/s, on the signed [-1, 1] range
  throttle_rate: 4.0            # units/s

# SLAM
enable_slam: true               # ORB-SLAM3 + mapping, same as start.py --enable-slam
slam:
  vocabulary: ORB_SLAM3/Vocabulary/ORBvoc.txt
  settings: orbslam_oakd_rgbd.yaml    # regenerate with scripts/gen_orbslam_settings.py

# mapping / BEV boundaries
mapping:
  boundary_min_points: 50       # wall points needed before we try extracting boundaries

recording: false                # dump buffers to disk (or start.py --recording)
recording_path: /tmp/pilot_recordings
recording_config:
  sample_k: 1                   # keep every k-th sample, 1 = all
  top_n: 0                      # max records per buffer, 0 = no limit
  # per-buffer overrides, anything missing falls back to the values above
  frame:
    sample_k: 2                 # frames are big
    top_n: 5000
  imu:
    sample_k: 1                 # imu is tiny, keep it all
    top_n: 0
  segmentation:
    sample_k: 2
    top_n: 5000
  pose:
    sample_k: 1
    top_n: 0
  control:
    sample_k: 1
    top_n: 0
  pointcloud:
    sample_k: 5
    top_n: 2000
  boundary:
    sample_k: 10
    top_n: 500

# web telemetry (HTTP POST), off by default
web_publish:
  enabled: false
  endpoint: "http://localhost:8080/api/telemetry"
  interval: 1.0                 # s between POSTs
  timeout: 2.0                  # s per request
  vehicle_id: "pilot_1"
  max_trajectory_pts: 500       # per payload

# ring buffer slot counts
buffers:
  frame:
    slots: 8
  imu:
    slots: 32
  segmentation:
    slots: 4
  pose:
    slots: 8
  control:
    slots: 8
  pointcloud:
    slots: 4
  boundary:
    slots: 2

