# config_zmq.yaml — AutoDRIVE simulator profile: sensors, ground-truth pose
# and control all go over ZMQ via the autodrive_bridge; no hardware.
#
#   python start.py --config config_zmq.yaml

# --- ZMQ (simulator bridge) ---
use_zmq: true                   # replace camera/IMU/I2C with the ZMQ bridge
zmq_host: "localhost"           # "autodrive_bridge" if the bridge runs in a separate container
zmq_sensor_port: 5555           # SUB: sensor data from the simulator
zmq_control_port: 5556          # PUB: control commands to the simulator
zmq_telemetry_port: 5557        # PUB: telemetry / visualisation data (see zmq_publish)
use_zmq_pose: true              # use the simulator's ground-truth pose; LIDAR projection builds the point cloud

# --- Sensor / Hardware (unused in simulator mode) ---
i2c_address: null               # no I2C hardware
i2c_bus: null
use_oakd_imu: false
synthetic: false                # not needed: frames come from the simulator

# --- Pipeline ---
resolution: [640, 360]          # [width, height] of simulator camera frames (px)
fps: 30                         # target frame rate (Hz)
device: "cuda:0"                # torch device for inference ("cpu" if no GPU)

# Depth camera far clip (m) — must match farClipPlane in the simulator's
# DepthCamera.cs (15.0).  The simulator sends an 8-bit linear depth image;
# ZMQSensorWorker converts it to metres as pixel / 255 * depth_max_meters.
depth_max_meters: 15.0

# --- Vision ---
segmentation_config_path: "pilot_vision/models/deeplab/config.yaml"

# --- Control ---
control_mode: "pid"             # pure_pursuit | stanley | lqr | mpc | policy | pid | ftg | lidar_pid | depth_ftg | vae | bc

# --- LIDAR (LidarProjectionWorker, used when enable_slam and use_zmq_pose) ---
# Simulated Hokuyo UST-10LX: 1080 rays, ±135°, 0.06–10 m range,
# mounted at [x=0.2733, y=0.0, z=0.096] m in the vehicle frame.
lidar:
  range_min: 0.1                # m, discard very close returns (vehicle body)
  range_max: 9.5                # m, discard max-range (no-return) values
  voxel_size: 0.10              # m, deduplication cell size
  move_threshold: 0.05          # m, minimum movement before projecting a new scan

# --- SLAM ---
enable_slam: true               # with use_zmq_pose: true, LIDAR projection replaces ORB-SLAM3
use_saved_map: false            # skip mapping and load boundaries from saved_map_path
saved_map_path: "rl/boundaries_easy"   # directory containing outer_line.npy / inner_line.npy
slam:
  vocabulary: "ORB_SLAM3/Vocabulary/ORBvoc.txt"
  settings: "simulator_orbslam_settings.yaml"   # ORB-SLAM3 settings for the simulator camera

# --- Mapping (BEV boundary extraction) ---
mapping:
  boundary_min_points: 50       # wall points required before boundaries are extracted
  bev_axes: [0, 1]              # simulator world: X, Y horizontal, Z up (ORB-SLAM3 camera frame would be [0, 2])
  forward_axis: 0               # simulator vehicle frame: X forward (ORB-SLAM3 camera frame would be 2)
  boundary_save_path: "rl/boundaries_easy"   # where extracted boundaries are saved (null disables saving)

# --- PID Control (control_mode: pid, and lidar_pid) ---
pid:
  kp_steer: 2.0                 # proportional steering gain
  ki_steer: 0.0                 # integral steering gain
  kd_steer: 0.1                 # derivative steering gain
  target_throttle: 0.05         # base throttle, signed [-1, 1]
  sector_deg: 60.0              # lidar_pid: half-angle of the forward sector used for wall detection
  slow_corner_factor: 0.6       # lidar_pid: throttle multiplier at full steer

# --- Boundary Follow-the-Gap (control_mode: ftg) ---
ftg:
  num_beams: 360                # rays in the virtual scan cast against the boundaries
  fov_deg: 270.0                # total field of view, centred on the heading
  max_range: 5.0                # m
  bubble_radius_deg: 30.0       # half-width of the safety bubble around the nearest obstacle
  smooth_window: 5              # moving-average window over the ranges
  target_throttle: 0.05         # base throttle, signed [-1, 1]
  throttle_corner_scale: 0.5    # throttle = base * (1 - scale * |steering|)
  noise_std: 0.05               # std of Gaussian noise added to steering
  gap_strategy: "deepest"       # "deepest" or "centroid"

# --- Shared Buffers (ring-buffer slots per stream) ---
buffers:
  frame:
    slots: 8
  imu:
    slots: 32
  segmentation:
    slots: 4
  pose:
    slots: 8
  control:
    slots: 8
  pointcloud:
    slots: 4
  boundary:
    slots: 2
  lidar:
    slots: 16

# --- ZMQ Telemetry (published on zmq_telemetry_port) ---
zmq_publish:
  enabled: true                 # publish telemetry back to the simulator
  control: true                 # control commands
  pose: true                    # trajectory
  segmentation: true            # segmentation masks
  boundary: true                # track boundaries (only when mapping runs)
  pointcloud: true              # point cloud (only when mapping runs)

# --- Recording ---
recording: false                # record buffers to disk (also: start.py --recording)
recording_path: "/tmp/pilot_recordings"
recording_config:
  sample_k: 1                   # save every k-th sample (1 = all)
  top_n: 1000                   # max records per buffer (0 = unlimited)

# --- Web Telemetry (optional HTTP publisher) ---
web_publish:
  enabled: false
