# Runs the tests in the no-hardware dev-local container (Dockerfile.dev-local)
#   docker compose -f docker-compose.dev-local.yaml up --build
version: "3.8"

services:
  dev-local:
    build:
      context: .
      dockerfile: Dockerfile.dev-local
    container_name: pilot_core_dev_local
    environment:
      - PILOT_SYNTHETIC=1
      - PYTHONUNBUFFERED=1
    volumes:
      # bind mount so edits show up without a rebuild
      - .:/app/pilot_core
    working_dir: /app/pilot_core
    command: >
      pytest tests/ -v --timeout=60 -x
